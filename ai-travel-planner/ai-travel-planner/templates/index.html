<!DOCTYPE html>
<html>
<head>
    <title>AI Travel Planner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="overlay">
    <div class="container">
        <h1>🌍 AI Travel Planner</h1>
        <p>Plan your perfect trip instantly ✈️</p>

        <form method="POST">
            <input type="text" name="city" placeholder="Enter city (e.g. Goa, Ujjain)" required>
            <button type="submit">Generate Plan</button>
            <button type="button" onclick="clearText()">Clear</button>
        </form>

        <div id="loader" class="loader" style="display:none;"></div>

        {% if result %}
        <div class="output">
            <h3>🗺️ Your Travel Plan</h3>
            <pre id="resultText">{{ result }}</pre>
            <button onclick="copyText()">📋 Copy</button>
        </div>
        {% endif %}
    </div>
</div>

<script>
function copyText() {
    var text = document.getElementById("resultText").innerText;
    navigator.clipboard.writeText(text);
    alert("Copied!");
}

function clearText() {
    document.querySelector("input").value = "";
}

document.querySelector("form").addEventListener("submit", function() {
    document.getElementById("loader").style.display = "block";
});
</script>

</body>
</html>
